<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>d3-force-3d WebGPU benchmark</title>
<script type="importmap">
{
  "imports": {
    "d3-dispatch": "https://cdn.jsdelivr.net/npm/d3-dispatch@3/+esm",
    "d3-timer": "https://cdn.jsdelivr.net/npm/d3-timer@3/+esm",
    "d3-quadtree": "https://cdn.jsdelivr.net/npm/d3-quadtree@3/+esm",
    "d3-binarytree": "https://cdn.jsdelivr.net/npm/d3-binarytree@1/+esm",
    "d3-octree": "https://cdn.jsdelivr.net/npm/d3-octree@1/+esm"
  }
}
</script>
<style>
  body { font: 14px/1.45 system-ui, sans-serif; margin: 2rem auto; max-width: 56rem; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.3rem; margin-bottom: .2rem; }
  .muted { color: #666; }
  form { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: end; margin: 1rem 0; }
  label { display: flex; flex-direction: column; font-size: .8rem; color: #555; gap: .2rem; }
  input, select { font: inherit; padding: .3rem .4rem; }
  button { font: inherit; padding: .4rem 1rem; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: .3rem .6rem; border-bottom: 1px solid #ddd; }
  th:first-child, td:first-child { text-align: left; }
  td.win { font-weight: 600; }
  td.wait { color: #bbb; }
  td .dot { display: inline-block; width: .55em; height: .55em; border-radius: 50%; background: #888; animation: pulse 1.3s ease-in-out infinite; }
  /* opacity and transform only: they keep animating while the page is busy running the CPU column */
  @keyframes pulse { 0%, 100% { opacity: .15; transform: scale(.75); } 50% { opacity: .85; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { td .dot { animation: none; opacity: .5; } }
  #env { margin-top: .3rem; }
  #log { color: #a30; white-space: pre-wrap; }
</style>

<h1>d3-force-3d: CPU vs WebGPU</h1>
<div class="muted" id="env"></div>

<form id="form">
  <label>Node counts <input id="sizes" value="1000, 5000, 20000, 50000, 100000, 500000" size="40"></label>
  <label>Dimensions
    <select id="dims"><option>1</option><option>2</option><option selected>3</option></select>
  </label>
  <label>Forces
    <select id="forces">
      <option value="typical">link + charge + center</option>
      <option value="collide">link + charge + center + collide</option>
      <option value="charge">charge only</option>
      <option value="link">link + center (no charge)</option>
    </select>
  </label>
  <label>CPU up to n = <input id="cpuMax" value="500000" size="8"></label>
  <button id="run">Run</button>
</form>

<table id="results">
  <thead><tr><th>nodes / links</th><th>CPU ms/tick</th><th>GPU ms/tick</th><th>speed-up</th></tr></thead>
  <tbody></tbody>
</table>
<div id="log"></div>

<script type="module">
import {forceSimulation, forceSimulationGPU, forceManyBody, forceLink, forceCenter, forceCollide} from "../src/index.js";
import {mountGPUStatus} from "./gpu-status.js";

var $ = function(id) { return document.getElementById(id); },
    params = new URLSearchParams(location.search);

for (var [key, value] of params) if ($(key) && key !== "run") $(key).value = value;

function log(text) { $("log").textContent += text + "\n"; }
function frame() { return new Promise(function(resolve) { setTimeout(resolve, 0); }); }

// Let the browser draw what has changed before a long run keeps the page busy. (A hidden tab draws
// no frames, hence the timeout.)
function paint() {
  return new Promise(function(resolve) {
    var timer = setTimeout(resolve, 100);
    requestAnimationFrame(function() { setTimeout(function() { clearTimeout(timer), resolve(); }, 0); });
  });
}

// Deterministic random tree plus extra random links.
function makeGraph(n, dims) {
  var s = 42, links = [], nodes = [];
  function rnd() { return (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296; }
  for (var i = 0; i < n; ++i) nodes.push({});
  for (i = 1; i < n; ++i) links.push({source: i, target: Math.floor(rnd() * i)});
  for (i = 0; i < n / 2; ++i) links.push({source: Math.floor(rnd() * n), target: Math.floor(rnd() * n)});
  return {nodes: nodes, links: links};
}

function setup(sim, graph, kind) {
  if (kind !== "charge") sim.force("link", forceLink(graph.links).distance(30));
  if (kind !== "link") sim.force("charge", forceManyBody());
  sim.force("center", forceCenter());
  if (kind === "collide") sim.force("collide", forceCollide(3));
  return sim;
}

// A CPU tick runs on the page's main thread. Only the ticks are timed; between slow ones the page
// gets a turn, so that it can draw and answer the user (a tick takes seconds at 500,000 nodes).
async function timeCPU(graph, dims, kind, budget) {
  var sim = setup(forceSimulation(graph.nodes, dims).stop(), graph, kind), ticks = 0, spent = 0, minTicks = graph.nodes.length >= 200000 ? 2 : 3, t0, yielded;
  sim.tick(1); // includes any lazy setup
  await frame();
  yielded = performance.now();
  while (ticks < 300 && (spent < budget || ticks < minTicks)) {
    t0 = performance.now();
    sim.tick(1);
    spent += performance.now() - t0, ++ticks;
    if (performance.now() - yielded > 50) await frame(), yielded = performance.now();
  }
  return {ms: spent / ticks, ticks: ticks};
}

async function timeGPU(graph, dims, kind, budget) {
  var sim = setup(forceSimulationGPU(graph.nodes, dims).stop(), graph, kind);
  if (!await sim.gpuReady()) throw new Error("the simulation fell back to the CPU");
  await sim.tickAsync(3); // warm-up
  var ticks = 10, t0;
  // grow the batch until it takes a measurable time
  while (true) {
    t0 = performance.now();
    await sim.tickAsync(ticks);
    var dt = performance.now() - t0;
    if (dt > budget / 2 || ticks >= 640) return sim.destroy(), {ms: dt / ticks, ticks: ticks};
    ticks *= 2;
  }
}

// A row of the table is added as soon as its size starts, and filled in as the numbers come:
// the cell being measured pulses, the ones still to come are dimmed.
function addRow(n) {
  var tr = document.createElement("tr"), cells = [];
  for (var i = 0; i < 4; ++i) cells.push(tr.appendChild(document.createElement("td")));
  cells[0].textContent = n + " / " + (n - 1 + Math.ceil(n / 2)); // the links of makeGraph
  $("results").tBodies[0].appendChild(tr);
  return cells;
}

function setCell(td, value) {
  td.className = "";
  td.textContent = "";
  if (value === "busy") td.appendChild(document.createElement("span")).className = "dot";
  else if (value === "wait") td.className = "wait", td.textContent = "·";
  else if (value && value.text !== undefined) td.textContent = value.text, td.className = value.win ? "win" : "";
  else td.textContent = value;
}

var results = window.__results = [];

async function run() {
  $("run").disabled = true;
  $("results").tBodies[0].innerHTML = "";
  $("log").textContent = "";
  results.length = 0;
  document.body.removeAttribute("data-done");

  var dims = +$("dims").value, kind = $("forces").value, cpuMax = +$("cpuMax").value,
      sizes = $("sizes").value.split(/[\s,]+/).map(Number).filter(Boolean);

  for (var n of sizes) {
    var row = {n: n, dims: dims, kind: kind}, graph, cells = addRow(n);
    setCell(cells[1], n <= cpuMax ? "wait" : "-"), setCell(cells[2], "busy"), setCell(cells[3], n <= cpuMax ? "wait" : "-");
    await paint();
    try {
      graph = makeGraph(n, dims);
      row.gpu = await timeGPU(graph, dims, kind, 1500);
      row.links = graph.links.length;
    } catch (error) {
      log("GPU run failed for n = " + n + ": " + error);
    }
    setCell(cells[2], row.gpu ? row.gpu.ms.toFixed(2) : "-");
    if (n <= cpuMax) {
      setCell(cells[1], "busy");
      await paint();
      graph = makeGraph(n, dims);
      row.cpu = await timeCPU(graph, dims, kind, 1500);
    }
    results.push(row);
    if (row.links) cells[0].textContent = n + " / " + row.links;
    setCell(cells[1], row.cpu ? row.cpu.ms.toFixed(2) : "-");
    setCell(cells[3], row.cpu && row.gpu ? {text: (row.cpu.ms / row.gpu.ms).toFixed(1) + "×", win: row.cpu.ms > row.gpu.ms} : "-");
    await frame();
  }
  $("run").disabled = false;
  document.body.setAttribute("data-done", "1");
}

$("form").addEventListener("submit", function(event) { event.preventDefault(); run(); });

(async function() {
  await mountGPUStatus($("env")); // which GPU this will measure (the GPU column fails without WebGPU)
  if (params.get("auto")) run();
})();
</script>
